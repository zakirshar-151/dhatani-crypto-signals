          public class BootReceiver extends BroadcastReceiver { public void onReceive(Context c,Intent i){String a=i.getAction();if(Intent.ACTION_BOOT_COMPLETED.equals(a)||Intent.ACTION_MY_PACKAGE_REPLACED.equals(a)){Intent x=new Intent(c,SignalMonitorService.class);if(Build.VERSION.SDK_INT>=26)c.startForegroundService(x);else c.startService(x);}}}
