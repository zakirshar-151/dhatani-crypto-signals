  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows EXE
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Dhatani-Crypto-Signals-Windows-EXE
          path: release/*.exe
          retention-days: 30

  webapp:
    name: Chrome WebApp / PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare PWA
        run: |
          rm -rf dist-web && mkdir dist-web
          cp index.html dist-web/index.html
          cp sw.js dist-web/sw.js
          cp manifest.webmanifest dist-web/manifest.webmanifest
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist-web/index.html')
          s=p.read_text(encoding='utf-8',errors='ignore')
          if 'manifest.webmanifest' not in s:
              s=s.replace('<head>', '<head>\n<link rel="manifest" href="/manifest.webmanifest">\n<meta name="theme-color" content="#07111f">', 1)
          p.write_text(s,encoding='utf-8')
          PY
          cd dist-web && zip -r ../Dhatani-Crypto-Signals-WebApp-PWA.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Dhatani-Crypto-Signals-WebApp-PWA
          path: Dhatani-Crypto-Signals-WebApp-PWA.zip
          retention-days: 30
