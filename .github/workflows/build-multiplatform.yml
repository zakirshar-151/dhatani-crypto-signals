name: Dhatani Crypto Signals - APK + EXE + WebApp

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # ANDROID APK 24/7
  # ============================================================
  android:
    name: Android APK 24/7
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create Android project
        shell: bash
        run: |

          set -e

          rm -rf app
          rm -f settings.gradle build.gradle gradle.properties

          mkdir -p app/src/main/java/com/dhatani/cryptosignals
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

          # ----------------------------------------------------
          # settings.gradle
          # ----------------------------------------------------

          cat > settings.gradle <<'EOG'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DhataniCryptoSignals"
          include(":app")
          EOG

          # ----------------------------------------------------
          # Root build.gradle
          # ----------------------------------------------------

          cat > build.gradle <<'EOG'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOG

          # ----------------------------------------------------
          # gradle.properties
          # ----------------------------------------------------

          cat > gradle.properties <<'EOG'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOG

          # ----------------------------------------------------
          # Android app build.gradle
          # ----------------------------------------------------

          cat > app/build.gradle <<'EOG'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dhatani.cryptosignals'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.dhatani.cryptosignals'
                  minSdk 23
                  targetSdk 35
                  versionCode 40000
                  versionName '4.0.0'
              }
          }
          EOG

          # ----------------------------------------------------
          # Copy main HTML into APK
          # ----------------------------------------------------

          cp index.html app/src/main/assets/index.html

          # ----------------------------------------------------
          # Android Theme
          # ----------------------------------------------------

          cat > app/src/main/res/values/styles.xml <<'EOG'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#00e5ff</item>

              </style>

          </resources>
          EOG

          # ----------------------------------------------------
          # Notification icon
          # ----------------------------------------------------

          cat > app/src/main/res/drawable/ic_stat_dhatani.xml <<'EOG'
          <vector
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">

              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M3,17 L8,12 L11,15 L17,8 L21,12 L21,15 L17,12 L11,19 L8,16 L5,19 Z"/>

              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M4,4 L4,20 L20,20 L20,18 L6,18 L6,4 Z"/>

          </vector>
          EOG

          # ----------------------------------------------------
          # Android Manifest
          # ----------------------------------------------------

          cat > app/src/main/AndroidManifest.xml <<'EOG'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <uses-permission
                  android:name="android.permission.POST_NOTIFICATIONS"/>

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE"/>

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>

              <uses-permission
                  android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>

              <uses-permission
                  android:name="android.permission.WAKE_LOCK"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Dhatani Crypto Signals"
                  android:icon="@drawable/ic_stat_dhatani"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN"/>

                          <category
                              android:name="android.intent.category.LAUNCHER"/>

                      </intent-filter>

                  </activity>

                  <service
                      android:name=".SignalMonitorService"
                      android:exported="false"
                      android:stopWithTask="false"
                      android:foregroundServiceType="specialUse">

                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="continuous Dhatani signal monitoring"/>

                  </service>

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.BOOT_COMPLETED"/>

                          <action
                              android:name="android.intent.action.MY_PACKAGE_REPLACED"/>

                      </intent-filter>

                  </receiver>

              </application>

          </manifest>
          EOG

          # ----------------------------------------------------
          # MainActivity.java
          # ----------------------------------------------------

          cat > app/src/main/java/com/dhatani/cryptosignals/MainActivity.java <<'EOG'
          package com.dhatani.cryptosignals;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  settings.setMixedContentMode(
                      WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                  );

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );

                  if (
                      Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(
                          Manifest.permission.POST_NOTIFICATIONS
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {

                      requestPermissions(
                          new String[]{
                              Manifest.permission.POST_NOTIFICATIONS
                          },
                          9
                      );
                  }

                  startMonitorService();
              }

              private void startMonitorService() {

                  Intent intent =
                      new Intent(
                          this,
                          SignalMonitorService.class
                      );

                  if (Build.VERSION.SDK_INT >= 26) {

                      startForegroundService(intent);

                  } else {

                      startService(intent);
                  }
              }

              @Override
              public void onBackPressed() {

                  if (
                      webView != null &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }
          }
          EOG

          # ----------------------------------------------------
          # SignalMonitorService.java
          # ----------------------------------------------------

          cat > app/src/main/java/com/dhatani/cryptosignals/SignalMonitorService.java <<'EOG'
          package com.dhatani.cryptosignals;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.IBinder;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;

          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;

          import java.util.Date;
          import java.util.concurrent.Executors;
          import java.util.concurrent.ScheduledExecutorService;
          import java.util.concurrent.TimeUnit;

          public class SignalMonitorService extends Service {

              private static final String API =
                  "https://dhatani-cloud-bot-live-production.up.railway.app/api/alerts";

              private static final String CHANNEL =
                  "dhatani_alerts";

              private ScheduledExecutorService executor;

              private String lastId = "";

              @Override
              public void onCreate() {

                  super.onCreate();

                  createChannel();

                  startForeground(
                      2407,
                      buildNotification(
                          "24/7 monitor running"
                      )
                  );

                  executor =
                      Executors.newSingleThreadScheduledExecutor();

                  executor.scheduleAtFixedRate(
                      this::poll,
                      0,
                      15,
                      TimeUnit.SECONDS
                  );
              }

              private void createChannel() {

                  NotificationChannel channel =
                      new NotificationChannel(
                          CHANNEL,
                          "Dhatani Signal Alerts",
                          NotificationManager.IMPORTANCE_HIGH
                      );

                  channel.setDescription(
                      "Dhatani 24/7 signal alerts"
                  );

                  NotificationManager manager =
                      getSystemService(
                          NotificationManager.class
                      );

                  manager.createNotificationChannel(channel);
              }

              private Notification buildNotification(
                  String text
              ) {

                  return new Notification.Builder(
                      this,
                      CHANNEL
                  )
                      .setSmallIcon(
                          R.drawable.ic_stat_dhatani
                      )
                      .setContentTitle(
                          "Dhatani Crypto Signals"
                      )
                      .setContentText(text)
                      .setOngoing(true)
                      .setCategory(
                          Notification.CATEGORY_SERVICE
                      )
                      .build();
              }

              private void poll() {

                  HttpURLConnection connection = null;

                  try {

                      long sinceMillis =
                          System.currentTimeMillis()
                          - 60000;

                      String since =
                          URLEncoder.encode(
                              new Date(
                                  sinceMillis
                              ).toInstant().toString(),
                              "UTF-8"
                          );

                      URL url =
                          new URL(
                              API + "?since=" + since
                          );

                      connection =
                          (HttpURLConnection)
                          url.openConnection();

                      connection.setConnectTimeout(7000);
                      connection.setReadTimeout(7000);

                      connection.setRequestProperty(
                          "Cache-Control",
                          "no-cache"
                      );

                      int responseCode =
                          connection.getResponseCode();

                      if (responseCode / 100 != 2) {

                          return;
                      }

                      BufferedReader reader =
                          new BufferedReader(
                              new InputStreamReader(
                                  connection.getInputStream()
                              )
                          );

                      StringBuilder body =
                          new StringBuilder();

                      String line;

                      while (
                          (line = reader.readLine())
                          != null
                      ) {

                          body.append(line);
                      }

                      reader.close();

                      JSONObject root =
                          new JSONObject(
                              body.toString()
                          );

                      JSONArray alerts =
                          root.optJSONArray(
                              "alerts"
                          );

                      if (
                          alerts == null ||
                          alerts.length() == 0
                      ) {

                          return;
                      }

                      JSONObject newest =
                          alerts.getJSONObject(
                              alerts.length() - 1
                          );

                      String id =
                          newest.optString(
                              "id",
                              ""
                          );

                      if (
                          !id.isEmpty() &&
                          !id.equals(lastId) &&
                          !lastId.isEmpty()
                      ) {

                          showAlert(
                              newest.optString(
                                  "type",
                                  "Signal Alert"
                              ),
                              newest.optString(
                                  "message",
                                  "New signal update"
                              )
                          );
                      }

                      if (!id.isEmpty()) {

                          lastId = id;
                      }

                  } catch (Exception ignored) {

                  } finally {

                      if (connection != null) {

                          connection.disconnect();
                      }
                  }
              }

              private void showAlert(
                  String title,
                  String body
              ) {

                  NotificationManager manager =
                      getSystemService(
                          NotificationManager.class
                      );

                  Notification notification =
                      new Notification.Builder(
                          this,
                          CHANNEL
                      )
                          .setSmallIcon(
                              R.drawable.ic_stat_dhatani
                          )
                          .setContentTitle(
                              "Dhatani · " + title
                          )
                          .setContentText(body)
                          .setStyle(
                              new Notification.BigTextStyle()
                                  .bigText(body)
                          )
                          .setAutoCancel(true)
                          .setPriority(
                              Notification.PRIORITY_HIGH
                          )
                          .build();

                  manager.notify(
                      (int)
                      (
                          System.currentTimeMillis()
                          & 0x7fffffff
                      ),
                      notification
                  );
              }

              @Override
              public int onStartCommand(
                  Intent intent,
                  int flags,
                  int startId
              ) {

                  return START_STICKY;
              }

              @Override
              public void onDestroy() {

                  if (executor != null) {

                      executor.shutdownNow();
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(
                  Intent intent
              ) {

                  return null;
              }
          }
          EOG

          # ----------------------------------------------------
          # BootReceiver.java
          # ----------------------------------------------------

          cat > app/src/main/java/com/dhatani/cryptosignals/BootReceiver.java <<'EOG'
          package com.dhatani.cryptosignals;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          public class BootReceiver
              extends BroadcastReceiver {

              @Override
              public void onReceive(
                  Context context,
                  Intent intent
              ) {

                  String action =
                      intent.getAction();

                  if (
                      Intent.ACTION_BOOT_COMPLETED.equals(
                          action
                      ) ||
                      Intent.ACTION_MY_PACKAGE_REPLACED.equals(
                          action
                      )
                  ) {

                      Intent service =
                          new Intent(
                              context,
                              SignalMonitorService.class
                          );

                      if (Build.VERSION.SDK_INT >= 26) {

                          context.startForegroundService(
                              service
                          );

                      } else {

                          context.startService(
                              service
                          );
                      }
                  }
              }
          }
          EOG

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dhatani-Crypto-Signals-APK-24x7
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30


  # ============================================================
  # WINDOWS EXE
  # ============================================================
  windows:
    name: Windows EXE
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows EXE
        run: npm run dist:win

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Dhatani-Crypto-Signals-Windows-EXE
          path: release/*.exe
          retention-days: 30


  # ============================================================
  # CHROME WEBAPP / PWA
  # ============================================================
  webapp:
    name: Chrome WebApp / PWA
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare PWA
        shell: bash
        run: |

          set -e

          rm -rf dist-web
          mkdir -p dist-web

          cp index.html dist-web/index.html
          cp sw.js dist-web/sw.js
          cp manifest.webmanifest dist-web/manifest.webmanifest

          python3 - <<'PY'
          from pathlib import Path

          p = Path("dist-web/index.html")

          s = p.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          if "manifest.webmanifest" not in s:

              s = s.replace(
                  "<head>",
                  '<head>\n<link rel="manifest" href="/manifest.webmanifest">\n<meta name="theme-color" content="#07111f">',
                  1
              )

          p.write_text(
              s,
              encoding="utf-8"
          )
          PY

          cd dist-web

          zip -r ../Dhatani-Crypto-Signals-WebApp-PWA.zip .

      - name: Upload WebApp
        uses: actions/upload-artifact@v4
        with:
          name: Dhatani-Crypto-Signals-WebApp-PWA
          path: Dhatani-Crypto-Signals-WebApp-PWA.zip
          retention-days: 30
