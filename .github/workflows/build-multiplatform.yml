          cat > app/src/main/java/com/dhatani/cryptosignals/SignalMonitorService.java <<'EOG'
          package com.dhatani.cryptosignals;
          import android.app.*; import android.content.*; import android.os.*; import org.json.*; import java.io.*; import java.net.*; import java.util.concurrent.*;
          public class SignalMonitorService extends Service {
            static final String API="https://dhatani-cloud-bot-live-production.up.railway.app/api/alerts"; static final String CH="dhatani_alerts"; ScheduledExecutorService ex; String last="";
            public void onCreate(){super.onCreate();channel();startForeground(2407,note("Dhatani 24/7 monitor running"));ex=Executors.newSingleThreadScheduledExecutor();ex.scheduleAtFixedRate(this::poll,0,15,TimeUnit.SECONDS);}
            void channel(){if(Build.VERSION.SDK_INT>=26){NotificationChannel c=new NotificationChannel(CH,"Dhatani Signal Alerts",NotificationManager.IMPORTANCE_HIGH);c.setDescription("Dhatani 24/7 signal alerts");getSystemService(NotificationManager.class).createNotificationChannel(c);}}
            Notification note(String t){return new Notification.Builder(this,CH).setSmallIcon(R.drawable.ic_stat_dhatani).setContentTitle("Dhatani Crypto Signals").setContentText(t).setOngoing(true).setCategory(Notification.CATEGORY_SERVICE).build();}
            void poll(){HttpURLConnection c=null;try{URL u=new URL(API+"?since="+URLEncoder.encode(new java.util.Date(System.currentTimeMillis()-60000).toInstant().toString(),"UTF-8"));c=(HttpURLConnection)u.openConnection();c.setConnectTimeout(7000);c.setReadTimeout(7000);c.setRequestProperty("Cache-Control","no-cache");if(c.getResponseCode()/100!=2)throw new IOException("HTTP "+c.getResponseCode());BufferedReader br=new BufferedReader(new InputStreamReader(c.getInputStream()));StringBuilder s=new StringBuilder(),l;while((l=br.readLine())!=null)s.append(l);br.close();JSONObject root=new JSONObject(s.toString());JSONArray a=root.optJSONArray("alerts");if(a!=null&&a.length()>0){JSONObject n=a.getJSONObject(a.length()-1);String id=n.optString("id","");if(!id.isEmpty()&&!id.equals(last)&&!last.isEmpty())show(n.optString("type","Signal Alert"),n.optString("message","New signal update"));if(!id.isEmpty())last=id;}}catch(Exception e){}finally{if(c!=null)c.disconnect();}}
            void show(String title,String body){NotificationManager n=getSystemService(NotificationManager.class);n.notify((int)(System.currentTimeMillis()&0x7fffffff),new Notification.Builder(this,CH).setSmallIcon(R.drawable.ic_stat_dhatani).setContentTitle("Dhatani · "+title).setContentText(body).setStyle(new Notification.BigTextStyle().bigText(body)).setAutoCancel(true).setPriority(Notification.PRIORITY_HIGH).build());}
            public int onStartCommand(Intent i,int f,int id){return START_STICKY;} public void onDestroy(){if(ex!=null)ex.shutdownNow();super.onDestroy();} public IBinder onBind(Intent i){return null;}
          }
