          # ====================================================
          # SIGNAL MONITOR SERVICE
          # ====================================================
          cat > app/src/main/java/com/dhatani/cryptosignals/SignalMonitorService.java <<'EOG'
package com.dhatani.cryptosignals;

import android.app.Notification;
import android.app.NotificationChannel;
import android.app.NotificationManager;
import android.app.Service;
import android.content.Intent;
import android.os.IBinder;

import org.json.JSONArray;
import org.json.JSONObject;

import java.io.BufferedReader;
import java.io.InputStreamReader;

import java.net.HttpURLConnection;
import java.net.URL;
import java.net.URLEncoder;

import java.nio.charset.StandardCharsets;

import java.util.Date;
import java.util.concurrent.Executors;
import java.util.concurrent.ScheduledExecutorService;
import java.util.concurrent.TimeUnit;


public class SignalMonitorService extends Service {


    // ========================================================
    // CLOUD ALERT API
    // ========================================================
    private static final String API =
        "https://dhatani-cloud-bot-live-production.up.railway.app/api/alerts";


    // ========================================================
    // NOTIFICATION CHANNEL
    // ========================================================
    private static final String CHANNEL =
        "dhatani_alerts";


    // ========================================================
    // POLLING INTERVAL
    // ========================================================
    private static final long POLL_SECONDS = 15;


    private ScheduledExecutorService executor;


    private String lastId = "";


    // ========================================================
    // CREATE SERVICE
    // ========================================================
    @Override
    public void onCreate() {

        super.onCreate();


        createChannel();


        startForeground(
            2407,
            buildNotification(
                "24/7 signal monitor running"
            )
        );


        executor =
            Executors.newSingleThreadScheduledExecutor();


        executor.scheduleAtFixedRate(
            this::poll,
            0,
            POLL_SECONDS,
            TimeUnit.SECONDS
        );
    }


    // ========================================================
    // CREATE NOTIFICATION CHANNEL
    // ========================================================
    private void createChannel() {

        NotificationChannel channel =
            new NotificationChannel(
                CHANNEL,
                "Dhatani Signal Alerts",
                NotificationManager.IMPORTANCE_HIGH
            );


        channel.setDescription(
            "Dhatani Crypto Signals 24/7 alerts"
        );


        channel.setShowBadge(true);


        NotificationManager manager =
            getSystemService(
                NotificationManager.class
            );


        if (manager != null) {

            manager.createNotificationChannel(
                channel
            );
        }
    }


    // ========================================================
    // FOREGROUND SERVICE NOTIFICATION
    // ========================================================
    private Notification buildNotification(
        String text
    ) {

        return new Notification.Builder(
            this,
            CHANNEL
        )
            .setSmallIcon(
                R.drawable.ic_stat_dhatani
            )
            .setContentTitle(
                "Dhatani Crypto Signals"
            )
            .setContentText(text)
            .setOngoing(true)
            .setCategory(
                Notification.CATEGORY_SERVICE
            )
            .build();
    }


    // ========================================================
    // POLL CLOUD API
    // ========================================================
    private void poll() {

        HttpURLConnection connection = null;


        try {

            // ------------------------------------------------
            // CHECK LAST 2 MINUTES
            // ------------------------------------------------
            long sinceMillis =
                System.currentTimeMillis()
                -
                (2 * 60 * 1000);


            String since =
                URLEncoder.encode(
                    new Date(
                        sinceMillis
                    )
                        .toInstant()
                        .toString(),
                    StandardCharsets.UTF_8.name()
                );


            // ------------------------------------------------
            // API URL
            // ------------------------------------------------
            URL url =
                new URL(
                    API
                    +
                    "?since="
                    +
                    since
                );


            // ------------------------------------------------
            // CONNECTION
            // ------------------------------------------------
            connection =
                (HttpURLConnection)
                url.openConnection();


            connection.setRequestMethod("GET");

            connection.setConnectTimeout(10000);

            connection.setReadTimeout(10000);

            connection.setUseCaches(false);


            connection.setRequestProperty(
                "Cache-Control",
                "no-cache, no-store"
            );


            connection.setRequestProperty(
                "Accept",
                "application/json"
            );


            // ------------------------------------------------
            // RESPONSE
            // ------------------------------------------------
            int responseCode =
                connection.getResponseCode();


            if (
                responseCode < 200
                ||
                responseCode >= 300
            ) {

                return;
            }


            // ------------------------------------------------
            // READ RESPONSE
            // ------------------------------------------------
            BufferedReader reader =
                new BufferedReader(
                    new InputStreamReader(
                        connection.getInputStream(),
                        StandardCharsets.UTF_8
                    )
                );


            StringBuilder body =
                new StringBuilder();


            String line;


            while (
                (line = reader.readLine())
                != null
            ) {

                body.append(line);
            }


            reader.close();


            // ------------------------------------------------
            // PARSE JSON
            // ------------------------------------------------
            JSONObject root =
                new JSONObject(
                    body.toString()
                );


            JSONArray alerts =
                root.optJSONArray(
                    "alerts"
                );


            if (
                alerts == null
                ||
                alerts.length() == 0
            ) {

                return;
            }


            // ------------------------------------------------
            // PROCESS ALERTS
            // ------------------------------------------------
            for (
                int i = 0;
                i < alerts.length();
                i++
            ) {

                JSONObject alert =
                    alerts.getJSONObject(i);


                String id =
                    alert.optString(
                        "id",
                        ""
                    );


                if (id.isEmpty()) {

                    continue;
                }


                // --------------------------------------------
                // FIRST SYNC
                // --------------------------------------------
                if (lastId.isEmpty()) {

                    lastId = id;

                    continue;
                }


                // --------------------------------------------
                // NEW ALERT
                // --------------------------------------------
                if (!id.equals(lastId)) {

                    String title =
                        alert.optString(
                            "type",
                            "Signal Alert"
                        );


                    String message =
                        alert.optString(
                            "message",
                            "New Dhatani signal update"
                        );


                    showAlert(
                        title,
                        message
                    );


                    lastId = id;
                }
            }


        } catch (Exception ignored) {

            // Keep service running if cloud
            // temporarily becomes unavailable.

        } finally {

            if (connection != null) {

                connection.disconnect();
            }
        }
    }


    // ========================================================
    // SHOW SIGNAL NOTIFICATION
    // ========================================================
    private void showAlert(
        String title,
        String body
    ) {

        NotificationManager manager =
            getSystemService(
                NotificationManager.class
            );


        if (manager == null) {

            return;
        }


        Notification notification =
            new Notification.Builder(
                this,
                CHANNEL
            )
                .setSmallIcon(
                    R.drawable.ic_stat_dhatani
                )
                .setContentTitle(
                    "Dhatani · " + title
                )
                .setContentText(
                    body
                )
                .setStyle(
                    new Notification.BigTextStyle()
                        .bigText(body)
                )
                .setAutoCancel(true)
                .setPriority(
                    Notification.PRIORITY_HIGH
                )
                .setCategory(
                    Notification.CATEGORY_EVENT
                )
                .build();


        int notificationId =
            (int)
            (
                System.currentTimeMillis()
                &
                0x7fffffff
            );


        manager.notify(
            notificationId,
            notification
        );
    }


    // ========================================================
    // START STICKY
    // ========================================================
    @Override
    public int onStartCommand(
        Intent intent,
        int flags,
        int startId
    ) {

        return START_STICKY;
    }


    // ========================================================
    // DESTROY
    // ========================================================
    @Override
    public void onDestroy() {

        if (executor != null) {

            executor.shutdownNow();
        }


        super.onDestroy();
    }


    // ========================================================
    // BIND
    // ========================================================
    @Override
    public IBinder onBind(
        Intent intent
    ) {

        return null;
    }
}
EOG


          # ====================================================
          # BOOT RECEIVER
          # ====================================================
          cat > app/src/main/java/com/dhatani/cryptosignals/BootReceiver.java <<'EOG'
package com.dhatani.cryptosignals;

import android.content.BroadcastReceiver;
import android.content.Context;
import android.content.Intent;
import android.os.Build;


public class BootReceiver
    extends BroadcastReceiver {


    @Override
    public void onReceive(
        Context context,
        Intent intent
    ) {


        String action =
            intent.getAction();


        // ----------------------------------------------------
        // START AFTER REBOOT OR APP UPDATE
        // ----------------------------------------------------
        if (
            Intent.ACTION_BOOT_COMPLETED.equals(
                action
            )
            ||
            Intent.ACTION_MY_PACKAGE_REPLACED.equals(
                action
            )
        ) {


            Intent service =
                new Intent(
                    context,
                    SignalMonitorService.class
                );


            if (Build.VERSION.SDK_INT >= 26) {

                context.startForegroundService(
                    service
                );

            } else {

                context.startService(
                    service
                );
            }
        }
    }
}
EOG


      # ========================================================
      # BUILD APK
      # ========================================================
      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle assembleDebug --no-daemon --stacktrace


      # ========================================================
      # UPLOAD APK
      # ========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dhatani-Crypto-Signals-APK-24x7
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30



  # ============================================================
  # WINDOWS EXE
  # ============================================================
  windows:
    name: Windows EXE
    runs-on: windows-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # NODE.JS
      # --------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # --------------------------------------------------------
      # INSTALL DEPENDENCIES
      # --------------------------------------------------------
      - name: Install Node dependencies
        shell: bash
        run: |
          npm install --no-audit --no-fund


      # --------------------------------------------------------
      # BUILD WINDOWS EXE
      #
      # --publish never prevents electron-builder from trying
      # to upload to GitHub Releases.
      # --------------------------------------------------------
      - name: Build Windows EXE
        shell: bash
        run: |
          npm run dist:win -- --publish never


      # --------------------------------------------------------
      # UPLOAD WINDOWS EXE
      # --------------------------------------------------------
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Dhatani-Crypto-Signals-Windows-EXE
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30



  # ============================================================
  # CHROME WEBAPP / PWA
  # ============================================================
  webapp:
    name: Chrome WebApp / PWA
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # PREPARE PWA
      # --------------------------------------------------------
      - name: Prepare PWA
        shell: bash
        run: |

          set -e

          rm -rf dist-web

          mkdir -p dist-web


          # --------------------------------------------------
          # COPY APP FILES
          # --------------------------------------------------
          cp index.html dist-web/index.html

          cp sw.js dist-web/sw.js

          cp manifest.webmanifest dist-web/manifest.webmanifest


          # --------------------------------------------------
          # ENSURE MANIFEST LINK
          # --------------------------------------------------
          python3 - <<'PY'
from pathlib import Path

p = Path("dist-web/index.html")

s = p.read_text(
    encoding="utf-8",
    errors="ignore"
)


if "manifest.webmanifest" not in s:

    s = s.replace(
        "<head>",
        '<head>\n<link rel="manifest" href="/manifest.webmanifest">\n<meta name="theme-color" content="#07111f">',
        1
    )


p.write_text(
    s,
    encoding="utf-8"
)
PY


